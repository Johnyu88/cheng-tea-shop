name: Generate reviewed security lockfile
on:
  pull_request:
    branches: [fix/docker-and-cloud-order-loop]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Regenerate lockfile with dependency scripts disabled
        run: |
          cp pnpm-lock.yaml /tmp/security-lock-before.yaml
          pnpm install --lockfile-only --ignore-scripts
      - name: Return generated public lockfile for review
        run: |
          diff -u --label pnpm-lock.yaml --label pnpm-lock.yaml /tmp/security-lock-before.yaml pnpm-lock.yaml > /tmp/security-lock.patch || test "$?" -eq 1
          node -e "process.stdout.write('GENERATED_LOCK_PATCH_BASE64=' + require('node:fs').readFileSync('/tmp/security-lock.patch').toString('base64') + '\\n')"
