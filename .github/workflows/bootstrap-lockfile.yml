name: Bootstrap lockfile

on:
  push:
    branches: [feature/wave-1-reproducible-baseline]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/bootstrap-lockfile.yml
          git commit -m "ci: finalize Playwright lockfile"
          git push
