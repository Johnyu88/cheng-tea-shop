name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/wave-1-reproducible-baseline

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Unit and component tests
        run: pnpm test:run
      - name: Phase 10-C focused mapping test
        run: pnpm test:run tests/phase-10c-erpnext-physical-mapping.test.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(^|[^[:alnum:]_])(sk_(live|test)_[A-Za-z0-9]{16,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----)' -- . ':(exclude)pnpm-lock.yaml'; then
            echo 'Credential-like literal detected in tracked files.'
            exit 1
          fi
