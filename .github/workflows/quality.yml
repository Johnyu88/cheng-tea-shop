name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test:run
      - name: Production build
        run: pnpm build
      - name: Browser and accessibility tests
        run: pnpm test:e2e
      - name: Synthetic mobile order and catalog tests
        run: pnpm exec playwright test --config=playwright.demo.config.ts
      - name: Build private cloud demo
        run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_COMMERCE: enabled
      - name: Private cloud production order loop
        run: node cloud-demo-smoke.mjs
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build container image
        run: docker build -t cheng-tea-shop:wave-1 .
      - name: Smoke-test container health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if docker ps -a --format '{{.Names}}' | grep -Fxq cheng-tea-shop-smoke; then
              docker rm -f cheng-tea-shop-smoke >/dev/null
            fi
          }
          trap cleanup EXIT
          docker run --detach --name cheng-tea-shop-smoke --publish 3000:3000 cheng-tea-shop:wave-1
          if ! curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors --retry-connrefused --connect-timeout 2 --max-time 5 --retry-max-time 60 http://127.0.0.1:3000/api/health; then
            docker logs cheng-tea-shop-smoke
            exit 1
          fi
