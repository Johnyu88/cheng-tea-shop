<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#355740"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="茶行帳務">
<link rel="manifest" href="/private-app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/tea-orders-192.png">
<title>陳老師茶行｜帳務 App</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#263b2d;background:#f7f4e9}*{box-sizing:border-box}
body{margin:0;padding:18px 15px 50px;max-width:690px;margin-inline:auto}h1{font-size:1.55rem}h2{font-size:1.2rem;margin-top:27px}
p{line-height:1.65}input,select,textarea,button{font:inherit;width:100%;min-height:45px;padding:10px;border-radius:8px;border:1px solid #b7bfb4;background:#fff}
button{background:#315640;color:#fff;border:0;font-weight:600;cursor:pointer}button.alt{background:#e2e7df;color:#203e2a}button.warn{background:#8f4744}
button:disabled{opacity:.55}label{display:block;margin:13px 0 5px;font-weight:600}.panel{background:white;border-radius:14px;padding:17px;margin-top:16px;box-shadow:0 1px 6px #143e1e16}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#5a695f;font-size:.87rem}.hide{display:none}.amount{font-weight:700;font-size:1.3rem}
.entry{padding:12px 0;border-bottom:1px solid #e9e9e5}.entry:last-child{border-bottom:0}.entry-head{display:flex;justify-content:space-between;gap:10px}
.badge{display:inline-block;background:#e8f0e8;border-radius:5px;padding:2px 6px}#status{min-height:22px}small{line-height:1.5}
</style></head>
<body>
<header><h1>陳老師茶行｜帳務</h1><p class="muted">私人離線 App · 手動記帳 · 不會自動接收網站訂單</p></header>
<section class="panel" id="unlock">
<h2>解鎖本機帳本</h2>
<p>第一次使用請設定至少 10 字的專用密語，以後使用同一密語解鎖。密語不會送出手機。</p>
<label for="pass">帳本密語</label><input id="pass" type="password" autocomplete="new-password" minlength="10" placeholder="至少 10 字">
<button id="open" style="margin-top:12px">建立／解鎖帳本</button>
<p class="muted">請記住密語。忘記密語無法還原加密帳本。請定期匯出備份；手機清除網站資料也會移除本機帳本。</p>
</section>
<main id="workspace" class="hide">
<section class="panel">
<div class="grid"><div><div class="muted">收入合計</div><div class="amount" id="income">NT$0</div></div>
<div><div class="muted">支出合計</div><div class="amount" id="expense">NT$0</div></div></div>
<p>收支差額：<strong id="balance">NT$0</strong></p>
</section>
<section class="panel"><h2>新增帳務紀錄</h2>
<form id="entry-form">
<label for="kind">類型</label><select id="kind"><option value="income">收入／收款</option><option value="expense">支出／退款</option></select>
<label for="date">日期</label><input id="date" type="date" required>
<label for="amount">金額（新台幣）</label><input id="amount" type="number" min="1" max="100000000" step="1" required>
<label for="memo">摘要／訂單編號</label><input id="memo" maxlength="150" placeholder="例如：茶款 261012-001" required>
<button type="submit" style="margin-top:15px">保存紀錄</button>
</form></section>
<section class="panel"><h2>帳務明細</h2><div id="entries"></div></section>
<section class="panel"><h2>保護與備份</h2>
<div class="grid"><button class="alt" id="export">匯出加密備份</button><button class="alt" id="lock">鎖定帳本</button></div>
<label for="restore">匯入加密備份（覆蓋目前帳本）</label><input type="file" id="restore" accept="application/json,.json">
<p class="muted">帳務只保存在此裝置、此瀏覽器，使用 AES-GCM 加密。不同手機目前不會自動同步。匯款入帳仍須銀行實際核對。</p>
</section>
</main>
<p id="status" role="status" aria-live="polite"></p>
<script>
(()=>{"use strict";
const KEY="cheng-tea-private-ledger-v1",ENC=new TextEncoder(),DEC=new TextDecoder(),$=id=>document.getElementById(id);
let pass="",records=[],sealed=null;
const msg=t=>{$("status").textContent=t},money=n=>"NT$"+n.toLocaleString("zh-TW");
function saltBytes(n){let b=new Uint8Array(n);crypto.getRandomValues(b);return b}
function to64(b){return btoa(String.fromCharCode(...b))}
function from64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function key(p,s){const base=await crypto.subtle.importKey("raw",ENC.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encrypt(data,p){const s=saltBytes(16),iv=saltBytes(12),k=await key(p,s);const cipher=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,ENC.encode(JSON.stringify(data))));return JSON.stringify({version:1,kdf:"PBKDF2-SHA256",iterations:250000,salt:to64(s),iv:to64(iv),ciphertext:to64(cipher)})}
async function decrypt(raw,p){const envelope=JSON.parse(raw);if(envelope.version!==1||envelope.iterations!==250000||envelope.kdf!=="PBKDF2-SHA256")throw Error("無法辨識備份格式");const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:from64(envelope.iv)},await key(p,from64(envelope.salt)),from64(envelope.ciphertext));const rows=JSON.parse(DEC.decode(plain));if(!Array.isArray(rows)||rows.length>200000||rows.some(x=>!x||!["income","expense"].includes(x.kind)||!Number.isSafeInteger(x.amount)||x.amount<1||x.amount>100000000||typeof x.memo!=="string"||x.memo.length>150||typeof x.date!=="string"))throw Error("帳本資料不完整");return rows}
async function save(){sealed=await encrypt(records,pass);localStorage.setItem(KEY,sealed)}
function render(){let inc=0,exp=0;for(const x of records){if(x.kind==="income")inc+=x.amount;else exp+=x.amount}$("income").textContent=money(inc);$("expense").textContent=money(exp);$("balance").textContent=money(inc-exp);
const root=$("entries");root.replaceChildren();if(!records.length){root.textContent="尚無紀錄。";return}
for(const r of [...records].sort((a,b)=>b.date.localeCompare(a.date))){const item=document.createElement("div");item.className="entry";const line=document.createElement("div");line.className="entry-head";const label=document.createElement("strong");label.textContent=(r.kind==="income"?"收入 ":"支出 ")+money(r.amount);const d=document.createElement("span");d.className="muted";d.textContent=r.date;line.append(label,d);const m=document.createElement("div");m.textContent=r.memo;const remove=document.createElement("button");remove.className="alt";remove.style.marginTop="8px";remove.textContent="刪除此筆";remove.onclick=async()=>{if(!confirm("確定刪除此筆帳務紀錄？"))return;records=records.filter(x=>x.id!==r.id);try{await save();render();msg("已更新帳本")}catch(e){msg("保存失敗，請勿關閉畫面："+e.message)}};item.append(line,m,remove);root.append(item)}}
function lock(){pass="";records=[];sealed=null;$("pass").value="";$("workspace").classList.add("hide");$("unlock").classList.remove("hide");msg("帳本已鎖定")}
$("open").onclick=async()=>{const p=$("pass").value;if(p.length<10){msg("請輸入至少 10 字密語");return}try{const raw=localStorage.getItem(KEY);records=raw?await decrypt(raw,p):[];pass=p;if(!raw)await save();$("pass").value="";$("unlock").classList.add("hide");$("workspace").classList.remove("hide");render();msg("帳本已解鎖；目前紀錄 "+records.length+" 筆")}catch{msg("密語錯誤，或帳本無法讀取；原資料未修改")}};
$("date").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
$("entry-form").onsubmit=async e=>{e.preventDefault();const amount=Number($("amount").value),memo=$("memo").value.trim(),date=$("date").value;if(!Number.isSafeInteger(amount)||amount<1||amount>100000000||!memo||!date){msg("請填寫有效金額、日期與摘要");return}records.push({id:crypto.randomUUID(),kind:$("kind").value,amount,date,memo});try{await save();render();$("amount").value="";$("memo").value="";msg("紀錄已加密保存")}catch(e){records.pop();msg("保存失敗："+e.message)}};
$("export").onclick=()=>{try{const data=localStorage.getItem(KEY);if(!data)throw Error("沒有可匯出的帳本");const link=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type:"application/json"}));link.href=url;link.download="陳老師茶行-加密帳務-"+new Date().toISOString().slice(0,10)+".json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg("已下載加密備份，請另存安全位置")}catch(e){msg(e.message)}};
$("restore").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>25*1024*1024){msg("備份檔過大");return}try{const raw=await f.text();const restored=await decrypt(raw,pass);if(!confirm("此操作將覆蓋這台裝置目前的帳本，確定匯入？"))return;localStorage.setItem(KEY,raw);records=restored;render();msg("加密帳本已匯入，共 "+records.length+" 筆")}catch{msg("匯入失敗：備份格式不符或密語不一致")}};
$("lock").onclick=lock;
if("serviceWorker" in navigator)navigator.serviceWorker.register("/private-app/sw.js",{scope:"/private-app/"}).catch(()=>{});
})();
</script>
</body></html>
